name: Build GSI (Universal)

on:
  workflow_dispatch:
    inputs:
      gsi_url:
        description: 'GSI 基础镜像直链（system.img）'
        required: true
      device_tree_repo:
        description: '设备树仓库地址'
        required: true
      kernel_source_repo:
        description: '内核源码仓库地址'
        required: true
      kernel_branch:
        description: '内核分支'
        required: false
        default: 'lineage-20'
      defconfig_name:
        description: 'defconfig 名'
        required: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: 读取配置
        run: |
          python3 << 'PYEOF'
          import yaml, os
          with open('.github/workflows/build-gsi-config.yml') as f:
              cfg = yaml.safe_load(f)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              def walk(prefix, d):
                  for k, v in d.items():
                      key = f"{prefix}_{k}".upper() if prefix else k.upper()
                      if isinstance(v, dict):
                          walk(key, v)
                      else:
                          f.write(f"CFG_{key}={v}\n")
              walk("", cfg)
          PYEOF

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y python3 python3-pip unzip zip aria2 \
            android-sdk-libsparse-utils erofs-utils simg2img img2simg \
            brotli lz4 xz-utils e2fsprogs gcc-aarch64-linux-gnu u-boot-tools
          pip3 install protobuf pyyaml

      - name: 下载 GSI 基础镜像
        run: |
          mkdir -p work/gsi
          aria2c -x16 -s16 --file-allocation=none "${{ inputs.gsi_url }}" -o work/gsi/base.img

      - name: 克隆内核源码
        run: |
          mkdir -p work
          cd work
          git clone --depth=1 -b "${{ inputs.kernel_branch }}" \
            "${{ inputs.kernel_source_repo }}" kernel_src 2>/dev/null || true

      - name: 克隆设备树
        run: |
          cd work
          git clone --depth=1 "${{ inputs.device_tree_repo }}" device_tree 2>/dev/null || true

      - name: 编译内核
        env:
          ENABLE_ROOT: ${{ env.CFG_ROOT_ENABLE }}
          ROOT_TYPE: ${{ env.CFG_ROOT_TYPE }}
          DEFCONFIG_NAME: ${{ inputs.defconfig_name }}
          DEVICE_MODEL: ${{ env.CFG_DEVICE_MODEL }}
          SYSTEM_NAME: ${{ env.CFG_DEVICE_SYSTEM_NAME }}
        run: bash scripts/build-gsi.sh kernel

      - name: 应用 MTK BPF 补丁
        if: env.CFG_KERNEL_PATCH_ENABLE_BPF == 'true'
        env:
          KERNEL_IMG_URL: ''
          DEFCONFIG_NAME: ${{ inputs.defconfig_name }}
        run: bash scripts/patch-bpf.sh

      - name: 注入配置并构建 GSI
        env:
          GSI_IMG: gsi/base.img
          PARTITION_TYPE: ${{ env.CFG_DEVICE_PARTITION_TYPE }}
          DEVICE_MODEL: ${{ env.CFG_DEVICE_MODEL }}
          SYSTEM_NAME: ${{ env.CFG_DEVICE_SYSTEM_NAME }}
          INJECT_FEATURES: ${{ env.CFG_GSI_INJECT_FEATURES }}
          INJECT_DISPLAY: ${{ env.CFG_GSI_INJECT_DISPLAY }}
          INJECT_INIT: ${{ env.CFG_GSI_INJECT_INIT }}
          INJECT_MEDIA: ${{ env.CFG_GSI_INJECT_MEDIA }}
          INJECT_PERMISSIONS: ${{ env.CFG_GSI_INJECT_PERMISSIONS }}
          OUTPUT_FORMAT: ${{ env.CFG_GSI_OUTPUT_FORMAT }}
        run: bash scripts/build-gsi.sh gsi

      - name: 输出 BPF 补丁状态
        if: env.CFG_KERNEL_PATCH_ENABLE_BPF == 'true'
        run: |
          if [ "$BPF_PATCHED" = "true" ]; then
            echo "## ✓ MTK BPF 补丁已应用" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ MTK BPF 补丁未应用" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 验证产物
        run: |
          ls -lh work/gsi/
          for f in work/gsi/*.img work/gsi/*.zip; do
            [ -f "$f" ] && file "$f"
          done

      - name: 上传到 123 网盘
        if: env.CFG_UPLOAD_PAN123 == 'true'
        env:
          PAN123_CLIENT_ID: ${{ secrets.PAN123_CLIENT_ID }}
          PAN123_CLIENT_SECRET: ${{ secrets.PAN123_CLIENT_SECRET }}
        run: bash scripts/upload-pan123.sh

      - name: 上传到 Artifact
        if: env.CFG_UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CFG_DEVICE_MODEL }}-${{ env.CFG_DEVICE_SYSTEM_NAME }}
          path: |
            work/gsi/*.img
            work/gsi/*.zip
          retention-days: 7