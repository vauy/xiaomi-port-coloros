# ============================================================
# GSI 构建配置
# ============================================================
# 说明：
#   - 用于 build-gsi.yml 工作流
#   - 比 GSI 修补多了「编译内核」步骤
#   - 必填项（GSI 镜像、设备树、内核源码）在 Actions 界面填写
# ============================================================

# ============================================================
# 设备信息
# ============================================================
device:
  # 机型代号（用于产物命名）
  model: "cannon"

  # 系统名（用于产物命名）
  system_name: "GSI"

  # 分区类型
  # a-only = A-only 分区（Redmi Note 9 5G）
  # a-b    = A/B 分区
  partition_type: "a-only"

# ============================================================
# 内核 Root
# ============================================================
root:
  # 是否集成 KernelSU
  # true = 编译带 Root 的内核
  # false = 跳过（推荐先不集成，跑通再开）
  enable: false

  # Root 方案
  # kernelsu-next = KernelSU Next（推荐）
  # kernelsu      = 原版 KernelSU
  type: "kernelsu-next"

# ============================================================
# 内核补丁
# ============================================================
kernel_patch:
  # MTK BPF 补丁
  # 4.14 / 4.19 内核必开
  enable_bpf: true

# ============================================================
# GSI 注入选项
# ============================================================
# true = 注入，false = 跳过
# ============================================================
gsi_inject:
  # 注入 device_features（硬件特性）
  features: true

  # 注入 displayconfig（屏幕参数）
  display: true

  # 注入 init.rc（初始化脚本）
  init: true

  # 注入媒体配置（音频/相机）
  media: true

  # 注入权限白名单
  permissions: true

# ============================================================
# GSI 输出
# ============================================================
gsi_output:
  # 输出格式
  # img  = 只出 system.img
  # zip  = 只出卡刷包
  # both = 两个都出（推荐）
  format: "both"

# ============================================================
# 上传方式
# ============================================================
# true = 上传，false = 跳过
# ============================================================
upload:
  # 123 网盘
  pan123: true

  # GitHub Artifact（7天过期）
  artifact: false