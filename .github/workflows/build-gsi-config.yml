# ============================================================
# GSI 构建配置
# ============================================================

device:
  model: "cannon"
  system_name: "GSI"
  # 分区类型：a-only / a-b
  partition_type: "a-only"

root:
  # 是否集成 KernelSU（先 false，跑通再开）
  enable: false
  # Root 方案：kernelsu-next / kernelsu
  type: "kernelsu-next"

kernel_patch:
  # MTK BPF 补丁（4.14/4.19 必开）
  enable_bpf: true

gsi_inject:
  features: true
  display: true
  init: true
  media: true
  permissions: true

gsi_output:
  # 输出格式：img / zip / both
  format: "both"

upload:
  pan123: true
  artifact: false