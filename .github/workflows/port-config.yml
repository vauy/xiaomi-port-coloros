# ============================================================
# ColorOS 移植配置
# ============================================================

device:
  # 机型代号
  model: "cannon"
  # 系统名
  system_name: "ColorOS"
  # 挖孔坐标（留空跳过）
  punch_hole_position: ""
  # 芯片平台（留空自动检测）
  soc_model: ""
  # 序列号（留空自动读取）
  serial_no: ""

root:
  # 是否集成 KernelSU
  enable: true
  # Root 方案：kernelsu-next / kernelsu
  type: "kernelsu-next"
  # KernelSU 版本（留空用最新）
  version: ""

kernel_patch:
  # MTK BPF 补丁（4.14/4.19 必开）
  enable_bpf: true

pack:
  # 打包模式：zip / super / both
  mode: "both"
  # super 分区大小（字节）
  super_size: "8589934592"

debloat:
  ad: true
  app_market: true
  game_center: true
  browser: true
  content_ext: true
  theme_store: true
  voice_assistant: true
  music: true
  video: true
  feedback: true
  ota: true
  push: false
  wallpaper: false
  gallery: false
  cloud: false
  account: false
  ime: false
  camera: false

replace:
  browser:
    enable: true
    url: "https://github.com/viayoo/ViaBrowser/releases/latest/download/ViaBrowser.apk"
    package: "mark.via"
  gallery:
    enable: false
    url: "https://github.com/SimpleMobileTools/Simple-Gallery/releases/latest/download/SimpleGallery.apk"
    package: "com.simplemobiletools.gallery.pro"
  file_manager:
    enable: false
    url: "https://github.com/zhanghai/MaterialFiles/releases/latest/download/MaterialFiles.apk"
    package: "me.zhanghai.android.files"

fix:
  openid: false
  selinux: false
  audio: false
  vibrator: false
  hdr: false
  wechat_scan: false
  wallpaper: false
  color_temp: false
  nfc: false
  modem: false

patch:
  replace_selinux: false
  first_api_level: true
  openid: true

upload:
  pan123: true
  release: false
  r2: false
  alist: false
  artifact: false