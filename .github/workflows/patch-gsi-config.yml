# ============================================================
# GSI 修补配置
# ============================================================
# 说明：
#   - 用于 patch-gsi.yml 工作流
#   - 必填项（GSI 镜像、设备树、内核源码）在 Actions 界面填写
# ============================================================

# ============================================================
# 设备信息
# ============================================================
device:
  # 机型代号（用于产物命名）
  model: "cannon"

  # 系统名（用于产物命名）
  system_name: "GSI"

  # 分区类型
  # a-only = A-only 分区（Redmi Note 9 5G）
  # a-b    = A/B 分区
  partition_type: "a-only"

# ============================================================
# 内核补丁
# ============================================================
kernel_patch:
  # MTK BPF 补丁
  # 4.14 / 4.19 内核必开
  # 解决 MTK 内核在 Android 12+ 上的网络问题
  enable_bpf: true

# ============================================================
# GSI 注入选项
# ============================================================
# true = 注入，false = 跳过
# 从设备树提取硬件配置，注入到 GSI 镜像
# ============================================================
gsi_inject:
  # 注入 device_features
  # 包含硬件特性开关（指纹、NFC、陀螺仪等）
  # 不注入会导致硬件功能异常
  features: true

  # 注入 displayconfig
  # 包含屏幕参数（分辨率、刷新率、色域等）
  # 不注入会导致显示异常
  display: true

  # 注入 init.rc
  # 包含设备专属的初始化脚本
  # 不注入会导致部分服务启动失败
  init: true

  # 注入媒体配置
  # 包含 media_*.xml、audio_*.xml、camera_*.xml
  # 不注入会导致音频、相机异常
  media: true

  # 注入权限白名单
  # 包含 privapp-permissions-*.xml
  # 不注入会导致系统服务因权限缺失而崩溃
  permissions: true

# ============================================================
# GSI 输出
# ============================================================
gsi_output:
  # 输出格式
  # img  = 只出 system.img
  # zip  = 只出卡刷包
  # both = 两个都出（推荐）
  format: "both"

# ============================================================
# 上传方式
# ============================================================
# true = 上传，false = 跳过
# ============================================================
upload:
  # 123 网盘
  pan123: true

  # GitHub Artifact（7天过期）
  artifact: false